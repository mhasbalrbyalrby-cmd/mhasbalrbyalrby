name: Phase 3 Validation

on:
  push:
    branches:
      - phase-3-fixes-2026-10-18
  pull_request:
    branches:
      - phase-3-fixes-2026-10-18
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Tests, TypeScript, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
