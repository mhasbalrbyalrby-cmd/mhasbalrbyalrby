name: Branch verification

on:
  push:
    branches:
      - fix/tenant-settings-owner-roles-logout
  pull_request:
    branches:
      - main

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
